name: Course quality

on:
  push:
    branches: [main, "anla/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser QA dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run numerical and content tests
        run: python -m unittest discover -s tests -v
      - name: Run responsive browser QA
        run: python scripts/browser_check.py
