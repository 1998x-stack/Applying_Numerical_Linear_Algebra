<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title11 desc11"><title id="title11">为什么范数条件数很大，也不一定意味着每个分量都不可靠</title><desc id="desc11">整体范数条件数与逐元素扰动敏感性描述不同的误差集合，不能互相替代。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="34" y="57" font-size="21" font-family="sans-serif" font-weight="700" fill="#1e2b30">一个对角阵的 κ₂ 非常大，为什么逐分量除法仍然可能准确？</text><rect x="32" y="100" width="182" height="104" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="123" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">diag(γ,1)</text><text x="123" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 1</text><rect x="254" y="100" width="182" height="104" rx="14" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="345" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">κ₂(A)=γ</text><text x="345" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 2</text><rect x="476" y="100" width="182" height="104" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="567" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">逐元素小扰动</text><text x="567" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 3</text><rect x="698" y="100" width="182" height="104" rx="14" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="789" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">每个分量仍可稳</text><text x="789" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 4</text><path d="M220 151 H244" stroke="#167a78" stroke-width="3" fill="none"/><path d="M234 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M442 151 H466" stroke="#167a78" stroke-width="3" fill="none"/><path d="M456 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M664 151 H688" stroke="#167a78" stroke-width="3" fill="none"/><path d="M678 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><text x="450" y="250" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#53676d">diag(γ,1) → κ₂(A)=γ → 逐元素小扰动 → 每个分量仍可稳</text></svg>