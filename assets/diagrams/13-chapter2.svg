<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title13 desc13"><title id="title13">一个过小的主元，如何让正确的方程算出错误答案</title><desc id="desc13">同一个矩阵仅通过行交换就把首步消去乘子的量级从 10⁴ 降为 10⁻⁴。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="34" y="57" font-size="21" font-family="sans-serif" font-weight="700" fill="#1e2b30">第一列的 10⁻⁴ 明明不是零，为什么交换行能显著改善计算？</text><rect x="32" y="100" width="182" height="104" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="123" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">小主元 10⁻⁴</text><text x="123" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 1</text><rect x="254" y="100" width="182" height="104" rx="14" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="345" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">乘子 10⁴</text><text x="345" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 2</text><rect x="476" y="100" width="182" height="104" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="567" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">交换行</text><text x="567" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 3</text><rect x="698" y="100" width="182" height="104" rx="14" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="789" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">乘子 10⁻⁴</text><text x="789" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 4</text><path d="M220 151 H244" stroke="#167a78" stroke-width="3" fill="none"/><path d="M234 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M442 151 H466" stroke="#167a78" stroke-width="3" fill="none"/><path d="M456 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M664 151 H688" stroke="#167a78" stroke-width="3" fill="none"/><path d="M678 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><text x="450" y="250" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#53676d">小主元 10⁻⁴ → 乘子 10⁴ → 交换行 → 乘子 10⁻⁴</text></svg>