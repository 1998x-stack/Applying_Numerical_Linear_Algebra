<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t01 d01"><title id="t01">矩阵维度与向量映射</title><desc id="d01">一个二行三列矩阵乘以三维列向量，得到二维列向量。</desc><rect x="18" y="18" width="864" height="264" rx="20" fill="#f7faf8"/><text x="55" y="66" font-size="22" fill="#1e2b30" font-weight="700">A ∈ Fᵐˣⁿ</text><rect x="58" y="95" width="230" height="125" rx="12" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><g fill="#245d5a" font-size="20" text-anchor="middle"><text x="95" y="137">a₁₁</text><text x="170" y="137">a₁₂</text><text x="245" y="137">a₁ₙ</text><text x="95" y="190">aₘ₁</text><text x="170" y="190">aₘ₂</text><text x="245" y="190">aₘₙ</text></g><text x="320" y="166" font-size="32" fill="#53676d">×</text><rect x="372" y="95" width="112" height="125" rx="12" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><g fill="#7f4635" font-size="20" text-anchor="middle"><text x="428" y="137">x₁</text><text x="428" y="166">⋮</text><text x="428" y="196">xₙ</text></g><path d="M510 158 H602" stroke="#167a78" stroke-width="4" fill="none"/><path d="M590 147 L604 158 L590 169" stroke="#167a78" stroke-width="4" fill="none"/><rect x="628" y="95" width="112" height="125" rx="12" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><g fill="#31577e" font-size="20" text-anchor="middle"><text x="684" y="137">y₁</text><text x="684" y="166">⋮</text><text x="684" y="196">yₘ</text></g><text x="770" y="151" font-size="20" fill="#1e2b30">Ax</text><text x="770" y="183" font-size="15" fill="#607077">∈ Fᵐ</text><text x="60" y="252" font-size="15" fill="#607077">矩阵列数 n 必须等于输入向量维度；输出维度由矩阵行数 m 决定。</text></svg>