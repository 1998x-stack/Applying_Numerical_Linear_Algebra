<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">矩阵均衡化：缩放能修复量级，却不会自动治好病态</title><desc id="d">等价的左右缩放会改变数值坐标；图中对角系统的条件数改善不代表任意矩阵都有此性质。</desc><rect width="960" height="410" rx="18" fill="#f7faf9"/><text x="36" y="46" font-size="22" font-family="sans-serif" font-weight="bold" fill="#173b40">2.5.2 · Equilibration</text><rect x="58" y="90" width="320" height="220" rx="10" fill="#fff" stroke="#b7c7cb" stroke-width="1.5"/><rect x="586" y="90" width="320" height="220" rx="10" fill="#fff" stroke="#b7c7cb" stroke-width="1.5"/><text x="218" y="125" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#24454b">原始 A = diag(10⁴,1)</text><text x="744" y="125" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#24454b">缩放后 B = I</text><rect x="140" y="146" width="70" height="70" rx="10" fill="#c76b4b" stroke="#b7c7cb" stroke-width="1.5"/><rect x="214" y="220" width="70" height="70" rx="10" fill="#d9f1ed" stroke="#b7c7cb" stroke-width="1.5"/><rect x="664" y="146" width="70" height="70" rx="10" fill="#4d9c91" stroke="#b7c7cb" stroke-width="1.5"/><rect x="738" y="220" width="70" height="70" rx="10" fill="#4d9c91" stroke="#b7c7cb" stroke-width="1.5"/><text x="175" y="188" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#fff">10⁴</text><text x="248" y="263" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#24454b">1</text><text x="699" y="188" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#fff">1</text><text x="773" y="263" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#fff">1</text><path d="M397 192 H566" stroke="#297c78" stroke-width="4"/><path d="M555 183 l13 9 -13 9" stroke="#297c78" stroke-width="4" fill="none"/><text x="481" y="175" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#24454b">C = diag(10⁻⁴,1)</text><text x="480" y="365" text-anchor="middle" font-size="18" font-family="sans-serif" fil