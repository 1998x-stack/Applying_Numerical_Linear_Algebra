<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">BLAS 三级为何代表三种完全不同的数据复用方式</title><desc id="d">同为乘加：Level 1 一条数据流、Level 2 流过大矩阵、Level 3 让小块数据反复复用。</desc><rect width="960" height="410" rx="18" fill="#f7faf9"/><text x="36" y="46" font-size="22" font-family="sans-serif" font-weight="bold" fill="#173b40">2.6.1 · BLAS levels</text><rect x="42" y="90" width="268" height="225" rx="10" fill="#e8f2f4" stroke="#b7c7cb" stroke-width="1.5"/><text x="176" y="132" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#24454b">LEVEL 1 · AXPY</text><text x="176" y="175" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#24454b">y ← αx + y</text><text x="176" y="224" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#24454b">2n FLOPs</text><text x="176" y="275" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#24454b">向量顺序读写</text><rect x="346" y="90" width="268" height="225" rx="10" fill="#eef3e3" stroke="#b7c7cb" stroke-width="1.5"/><text x="480" y="132" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#24454b">LEVEL 2 · GEMV</text><text x="480" y="175" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#24454b">y ← Ax</text><text x="480" y="224" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#24454b">≈2n² FLOPs</text><text x="480" y="275" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#24454b">矩阵每项通常一次</text><rect x="651" y="90" width="268" height="225" rx="10" fill="#fbf0e4" stroke="#b7c7cb" stroke-width="1.5"/><text x="785" y="132" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#24454b">LEVEL 3 · GEMM</text><text x="785" y="175" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#24454b">C ← AB + C</text><text x="785" y="224" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#24454b">≈2n³ FLOPs</text><text x="785" y="275" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#24454b">同一块重复乘加</text><text x="480" y="370" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#24454b">算术密度随数据复用变化：1 → 2 → 3 不是计时加速保证</text></svg>