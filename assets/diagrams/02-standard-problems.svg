<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t02 d02"><title id="t02">数值线性代数四类标准问题</title><desc id="d02">矩阵与数据输入后，分为线性系统、最小二乘、特征值和奇异值四类目标。</desc><rect width="900" height="330" rx="18" fill="#f7faf8"/><rect x="35" y="120" width="150" height="86" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="110" y="155" font-size="22" text-anchor="middle" fill="#1e2b30" font-weight="700">A, b</text><text x="110" y="183" font-size="15" text-anchor="middle" fill="#607077">输入数据</text><path d="M185 163 H255 M255 163 V57 H305 M255 163 V130 H305 M255 163 V205 H305 M255 163 V278 H305" stroke="#9aa9a7" stroke-width="3" fill="none"/><g><rect x="305" y="25" width="250" height="64" rx="12" fill="#eaf0f8" stroke="#416b9c"/><text x="430" y="53" font-size="19" text-anchor="middle" fill="#294f77" font-weight="700">Ax = b</text><text x="430" y="75" font-size="13" text-anchor="middle" fill="#607077">求精确解</text><rect x="305" y="98" width="250" height="64" rx="12" fill="#f8ece7" stroke="#c76c4c"/><text x="430" y="126" font-size="19" text-anchor="middle" fill="#7f4635" font-weight="700">min ||Ax − b||₂</text><text x="430" y="148" font-size="13" text-anchor="middle" fill="#607077">最佳拟合</text><rect x="305" y="171" width="250" height="64" rx="12" fill="#f0edf8" stroke="#7461ba"/><text x="430" y="199" font-size="19" text-anchor="middle" fill="#5a4b91" font-weight="700">Av = λv</text><text x="430" y="221" font-size="13" text-anchor="middle" fill="#607077">不变方向</text><rect x="305" y="244" width="250" height="64" rx="12" fill="#edf4ea" stroke="#6c9563"/><text x="430" y="272" font-size="19" text-anchor="middle" fill="#42663a" font-weight="700">A = UΣV*</text><text x="430" y="294" font-size="13" text-anchor="middle" fill="#607077">正交方向与伸缩</text></g><path d="M555 57 H625 M555 130 H625 M555 203 H625 M555 276 H625" stroke="#9aa9a7" stroke-width="3"/><text x="648" y="65" font-size="15" fill="#1e2b30">分解求解</text><text x="648" y="138" font-size="15" fil