<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title description"><title id="title">对称但不定：为何 LDLᵀ 分解必须允许 2×2 主元块</title><desc id="description">A=[[0,1],[1,t]] 始终有一个正特征值、一个负特征值；为保持对称结构，稳定 LDLᵀ 可以选用 2×2 主元。</desc><rect width="960" height="410" rx="18" fill="#f7faf9"/><text x="40" y="47" fill="#173b40" font-size="24" font-weight="bold" font-family="sans-serif">2.7.2 · 对称但不定：为何 LDLᵀ 分解必须允许 </text><text x="240" y="105" fill="#233f48" font-size="22" text-anchor="middle" font-family="sans-serif">对称矩阵 A(0)</text><rect x="115" y="132" width="120" height="100" rx="8" stroke="#f7faf9" stroke-width="2" fill="#e5bca7"/><rect x="245" y="132" width="120" height="100" rx="8" stroke="#f7faf9" stroke-width="2" fill="#e4f2ed"/><rect x="115" y="242" width="120" height="100" rx="8" stroke="#f7faf9" stroke-width="2" fill="#e4f2ed"/><rect x="245" y="242" width="120" height="100" rx="8" stroke="#f7faf9" stroke-width="2" fill="#e5bca7"/><text x="175" y="195" fill="#233f48" font-size="32" text-anchor="middle" font-family="sans-serif">0</text><text x="305" y="195" fill="#233f48" font-size="32" text-anchor="middle" font-family="sans-serif">1</text><text x="175" y="306" fill="#233f48" font-size="32" text-anchor="middle" font-family="sans-serif">1</text><text x="305" y="306" fill="#233f48" font-size="32" text-anchor="middle" font-family="sans-serif">0</text><text x="675" y="103" fill="#233f48" font-size="20" text-anchor="middle" font-family="sans-serif">特征值符号轴</text><path d="M540 226 H870" stroke="#495f66" stroke-width="3"/><circle cx="595" cy="226" r="11" fill="#c76e59"/><circle cx="815" cy="226" r="11" fill="#328e87"/><text x="595" y="193" fill="#c76e59" font-size="26" text-anchor="middle" font-family="sans-serif">−1</text><text x="815" y="193" fill="#328e87" font-size="26" text-anchor="middle" font-family="sans-serif">+1</text><text x="705" y="263" fill="#233f48" font-size="18" text-anchor="middle" font-family="sans-serif">0</text><text x="697" y="34