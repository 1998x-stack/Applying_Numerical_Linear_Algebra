<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t04 d04"><title id="t04">条件数描述扰动放大</title><desc id="d04">微小输入扰动经过问题映射后，可能变成较大的输出变化；条件数刻画敏感程度。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><rect x="35" y="95" width="180" height="110" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="125" y="135" text-anchor="middle" font-size="20" fill="#1e2b30" font-weight="700">输入 x</text><text x="125" y="166" text-anchor="middle" font-size="15" fill="#607077">x + δx</text><path d="M215 150 H335" stroke="#167a78" stroke-width="4"/><path d="M323 139 L337 150 L323 161" stroke="#167a78" stroke-width="4" fill="none"/><rect x="340" y="95" width="220" height="110" rx="14" fill="#fff" stroke="#416b9c" stroke-width="2"/><text x="450" y="135" text-anchor="middle" font-size="20" fill="#294f77" font-weight="700">问题映射 f</text><text x="450" y="166" text-anchor="middle" font-size="15" fill="#607077">局部斜率 / κ(A)</text><path d="M560 150 H680" stroke="#c76c4c" stroke-width="4"/><path d="M668 139 L682 150 L668 161" stroke="#c76c4c" stroke-width="4" fill="none"/><rect x="685" y="95" width="180" height="110" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="775" y="135" text-anchor="middle" font-size="20" fill="#7f4635" font-weight="700">输出 y</text><text x="775" y="166" text-anchor="middle" font-size="15" fill="#607077">y + δy</text><path d="M95 235 H190" stroke="#167a78" stroke-width="8" stroke-linecap="round"/><text x="205" y="241" font-size="14" fill="#607077">小输入变化</text><path d="M685 235 H850" stroke="#c76c4c" stroke-width="8" stroke-linecap="round"/><text x="665" y="270" font-size="14" fill="#607077">可能被放大的输出变化</text><text x="360" y="260" font-size="15" fill="#1e2b30" font-weight="700">条件数大 ≠ 算法不稳定</text></svg>