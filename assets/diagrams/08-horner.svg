<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t08 d08"><title id="t08">Horner 多项式嵌套求值</title><desc id="d08">多项式从最高次系数开始，逐步乘以 x 并加上下一个系数。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="50" y="60" font-size="20" fill="#1e2b30" font-weight="700">p(x)=a₃x³+a₂x²+a₁x+a₀</text><g><rect x="50" y="115" width="125" height="66" rx="12" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="112" y="155" text-anchor="middle" font-size="22" fill="#167a78" font-weight="700">b₃ = a₃</text><path d="M175 148 H230" stroke="#167a78" stroke-width="3"/><rect x="230" y="115" width="150" height="66" rx="12" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="305" y="155" text-anchor="middle" font-size="20" fill="#294f77">b₂=a₂+xb₃</text><path d="M380 148 H435" stroke="#167a78" stroke-width="3"/><rect x="435" y="115" width="150" height="66" rx="12" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="510" y="155" text-anchor="middle" font-size="20" fill="#7f4635">b₁=a₁+xb₂</text><path d="M585 148 H640" stroke="#167a78" stroke-width="3"/><rect x="640" y="115" width="150" height="66" rx="12" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="715" y="155" text-anchor="middle" font-size="20" fill="#42663a">b₀=a₀+xb₁</text></g><text x="450" y="232" text-anchor="middle" font-size="17" fill="#607077">每一步只保留一个累积值；n 次乘加即可完成 n 次多项式求值。</text></svg>