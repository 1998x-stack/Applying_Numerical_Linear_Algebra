<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title14 desc14"><title id="title14">高斯消去为什么通常稳定，却仍存在指数增长的反例</title><desc id="desc14">Wilkinson 型例子在并列主元规则下增长因子为 2ⁿ⁻¹；它说明理论最坏界不能被忽略。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="34" y="57" font-size="21" font-family="sans-serif" font-weight="700" fill="#1e2b30">既然每个消去乘子都不超过 1，为什么 GEPP 仍可能产生巨大的误差界？</text><rect x="32" y="100" width="182" height="104" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="123" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">原矩阵 max=1</text><text x="123" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 1</text><rect x="254" y="100" width="182" height="104" rx="14" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="345" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">消去后出现 2</text><text x="345" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 2</text><rect x="476" y="100" width="182" height="104" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="567" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">再增长至 4</text><text x="567" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 3</text><rect x="698" y="100" width="182" height="104" rx="14" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="789" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">第四阶达到 8</text><text x="789" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 4</text><path d="M220 151 H244" stroke="#167a78" stroke-width="3" fill="none"/><path d="M234 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M442 151 H466" stroke="#167a78" stroke-width="3" fill="none"/><path d="M456 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M664 151 H688" stroke="#167a78" stroke-width="3" fill="none"/><path d="M678 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><text x="450" y="250" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#53676d">原矩阵 max=1 → 消去后出现 2 → 再增长至 4 → 第四阶达到 8</text></svg>