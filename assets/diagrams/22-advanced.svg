<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title description"><title id="title">Roofline 与并行瓶颈：FLOPs 很多也可能跑不快</title><desc id="description">Roofline 由带宽斜线和计算平台相交形成；高于屋顶的性能不可达到，低于屋顶的原因仍需分析。</desc><rect width="960" height="410" rx="18" fill="#f7faf9"/><text x="40" y="47" fill="#173b40" font-size="24" font-weight="bold" font-family="sans-serif">2.6.4 · Roofline 与并行瓶颈：FLOPs </text><rect x="65" y="90" width="825" height="260" rx="8" stroke="#f7faf9" stroke-width="2" fill="#fff"/><path d="M100 328 V110 M100 328 H858" stroke="#395b67" stroke-width="3" fill="none"/><polyline points="100,303 190,278 280,253 370,228 460,203 550,178 640,153 730,143 820,143" fill="none" stroke="#3786a4" stroke-width="4"/><path d="M100 143 H840" stroke="#c77653" stroke-width="3" stroke-dasharray="9 6"/><text x="490" y="128" fill="#c77653" font-size="19" text-anchor="middle" font-family="sans-serif">计算上限 Ppeak</text><text x="290" y="251" fill="#3786a4" font-size="17" text-anchor="middle" font-family="sans-serif">带宽上限 βI（斜线）</text><text x="740" y="378" fill="#233f48" font-size="16" text-anchor="middle" font-family="sans-serif">操作密度 I →</text><text x="125" y="115" fill="#233f48" font-size="15" text-anchor="middle" font-family="sans-serif">性能↑</text><text x="485" y="292" fill="#233f48" font-size="17" text-anchor="middle" font-family="sans-serif">拐点之后，上限不再随 I 上升</text></svg>