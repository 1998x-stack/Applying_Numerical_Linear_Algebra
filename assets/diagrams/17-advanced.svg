<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">迭代改进：为什么低精度分解配合高精度残差仍能修正解</title><desc id="d">每一轮的残差定位当前误差，低精度因子再把残差映射成校正量；图中收敛轨迹不是实验数据。</desc><rect width="960" height="410" rx="18" fill="#f7faf9"/><text x="36" y="46" font-size="22" font-family="sans-serif" font-weight="bold" fill="#173b40">2.5.1 · Single Precision Iterative Refinement</text><rect x="58" y="98" width="185" height="110" rx="10" fill="#eaf1f8" stroke="#b7c7cb" stroke-width="1.5"/><text x="150" y="147" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#24454b">低精度初值 x₀</text><text x="150" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#24454b">近似</text><rect x="260" y="98" width="185" height="110" rx="10" fill="#e3f4ec" stroke="#b7c7cb" stroke-width="1.5"/><text x="352" y="147" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#24454b">高精度 r=b−Ax</text><text x="352" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#24454b">定位误差</text><rect x="462" y="98" width="185" height="110" rx="10" fill="#fff0df" stroke="#b7c7cb" stroke-width="1.5"/><text x="554" y="147" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#24454b">低精度修正 d</text><text x="554" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#24454b">近似 A⁻¹r</text><rect x="664" y="98" width="185" height="110" rx="10" fill="#e8f0f6" stroke="#b7c7cb" stroke-width="1.5"/><text x="756" y="147" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#24454b">更新 x←x+d</text><text x="756" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#24454b">回到残差</text><path d="M244 150 h15" stroke="#297c78" stroke-width="3"/><path d="M446 150 h15" stroke="#297c78" stroke-width="3"/><path d="M648 150 h15" stroke="#297c78" stroke-width="3"/><path d="M758 210 v43 H146 V210" fill="none" stroke="#297c78" stroke-width="3" stroke-dasharray="8 5"/><text x="450" y="286" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#24454b">如果校正算子足够准确，误差继续收缩</text><rect x="150" y="316" width="120" height="15" rx="10" fill="#36918c" stroke="#b7c7cb" stroke-width="1.5"/><rect x="320" y="316" width="40" height="15" rx="10" fill="#36918c" stroke="#b7c7cb" stroke-width="1.5"/><rect x="490" y="316" width="13" height="15" rx="10" fill="#36918c" stroke="#b7c7cb" stroke-width="1.5"/><rect x="660" y="316" width="10" height="15" rx="10" fill="#36918c" stroke="#b7c7cb" stroke-width="1.5"/><text x="480" y="385" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#24454b">示意误差衰减：图中长度不是测量数据</text></svg>