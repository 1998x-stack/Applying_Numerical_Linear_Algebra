<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title09 desc09"><title id="title09">从 Ax=b 出发：如何判断一个线性方程组求得是否可靠</title><desc id="desc09">求解并非只输出 x̂：数据、算法、近似解与数值诊断构成闭环。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="34" y="57" font-size="21" font-family="sans-serif" font-weight="700" fill="#1e2b30">为什么同一个线性系统可能需要完全不同的求解算法？</text><rect x="32" y="100" width="182" height="104" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="123" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">A、b 是输入</text><text x="123" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 1</text><rect x="254" y="100" width="182" height="104" rx="14" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="345" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">直接法 / 迭代法</text><text x="345" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 2</text><rect x="476" y="100" width="182" height="104" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="567" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">计算 x̂</text><text x="567" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 3</text><rect x="698" y="100" width="182" height="104" rx="14" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="789" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">残差与条件诊断</text><text x="789" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 4</text><path d="M220 151 H244" stroke="#167a78" stroke-width="3" fill="none"/><path d="M234 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M442 151 H466" stroke="#167a78" stroke-width="3" fill="none"/><path d="M456 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M664 151 H688" stroke="#167a78" stroke-width="3" fill="none"/><path d="M678 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><text x="450" y="250" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#53676d">A、b 是输入 → 直接法 / 迭代法 → 计算 x̂ → 残差与条件诊断</text></svg>