<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title12 desc12"><title id="title12">把高斯消去拆开看：行交换、乘子与三角求解</title><desc id="desc12">对原系统先作用置换 P，再通过 L 和 U 依次完成前代和回代，因子可以重复使用。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="34" y="57" font-size="21" font-family="sans-serif" font-weight="700" fill="#1e2b30">为什么消去一个变量，最后却能保留用于多次求解的因子？</text><rect x="32" y="100" width="182" height="104" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="123" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">选取列最大主元</text><text x="123" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 1</text><rect x="254" y="100" width="182" height="104" rx="14" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="345" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">交换行 P</text><text x="345" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 2</text><rect x="476" y="100" width="182" height="104" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="567" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">消去乘子入 L</text><text x="567" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 3</text><rect x="698" y="100" width="182" height="104" rx="14" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="789" y="139" fill="#22353a" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700">回代解 Ux=y</text><text x="789" y="169" fill="#64767c" font-family="sans-serif" text-anchor="middle" font-size="13">步骤 4</text><path d="M220 151 H244" stroke="#167a78" stroke-width="3" fill="none"/><path d="M234 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M442 151 H466" stroke="#167a78" stroke-width="3" fill="none"/><path d="M456 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><path d="M664 151 H688" stroke="#167a78" stroke-width="3" fill="none"/><path d="M678 143 l10 8 -10 8" stroke="#167a78" stroke-width="3" fill="none"/><text x="450" y="250" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#53676d">选取列最大主元 → 交换行 P → 消去乘子入 L → 回代解 Ux=y</text></svg>