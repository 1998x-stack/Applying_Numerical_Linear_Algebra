<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t07 d07"><title id="t07">可信数值软件验证闭环</title><desc id="d07">问题契约、成熟数值库、误差检查和可复现记录形成闭环。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><g><rect x="35" y="90" width="180" height="110" rx="14" fill="#e4f2ef" stroke="#167a78" stroke-width="2"/><text x="125" y="130" text-anchor="middle" font-size="19" fill="#1e2b30" font-weight="700">问题契约</text><text x="125" y="160" text-anchor="middle" font-size="14" fill="#607077">形状 · 结构 · 精度</text><rect x="265" y="90" width="180" height="110" rx="14" fill="#eaf0f8" stroke="#416b9c" stroke-width="2"/><text x="355" y="130" text-anchor="middle" font-size="19" fill="#294f77" font-weight="700">数值库</text><text x="355" y="160" text-anchor="middle" font-size="14" fill="#607077">BLAS · LAPACK</text><rect x="495" y="90" width="180" height="110" rx="14" fill="#f8ece7" stroke="#c76c4c" stroke-width="2"/><text x="585" y="130" text-anchor="middle" font-size="19" fill="#7f4635" font-weight="700">结果验证</text><text x="585" y="160" text-anchor="middle" font-size="14" fill="#607077">残差 · 后向误差</text><rect x="725" y="90" width="140" height="110" rx="14" fill="#edf4ea" stroke="#6c9563" stroke-width="2"/><text x="795" y="130" text-anchor="middle" font-size="19" fill="#42663a" font-weight="700">记录</text><text x="795" y="160" text-anchor="middle" font-size="14" fill="#607077">版本 · 环境</text></g><g stroke="#8b9b9b" stroke-width="3" fill="none"><path d="M215 145 H265"/><path d="M445 145 H495"/><path d="M675 145 H725"/></g><path d="M795 205 V245 H125 V205" stroke="#167a78" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><text x="460" y="270" text-anchor="middle" font-size="14" fill="#607077">失败用例反馈到问题契约与测试集</text></svg>