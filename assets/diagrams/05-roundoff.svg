<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t05 d05"><title id="t05">浮点数舍入到有限可表示数</title><desc id="d05">实数精确结果落在两个可表示浮点数之间，舍入规则选择一个邻近值。</desc><rect width="900" height="300" rx="18" fill="#f7faf8"/><text x="60" y="62" font-size="20" fill="#1e2b30" font-weight="700">实数轴上的精确结果与可表示浮点数</text><path d="M110 170 H790" stroke="#64777c" stroke-width="3"/><g stroke="#167a78" stroke-width="3"><path d="M220 148 V192"/><path d="M420 148 V192"/><path d="M620 148 V192"/></g><g fill="#167a78" font-size="18" text-anchor="middle"><text x="220" y="224">f₋</text><text x="620" y="224">f₊</text></g><path d="M420 115 V200" stroke="#c76c4c" stroke-width="4" stroke-dasharray="6 5"/><circle cx="420" cy="170" r="9" fill="#c76c4c"/><text x="420" y="98" text-anchor="middle" font-size="18" fill="#9c5138" font-weight="700">精确结果</text><path d="M420 170 L220 170" stroke="#c76c4c" stroke-width="2" stroke-dasharray="4 5"/><path d="M420 170 L620 170" stroke="#c76c4c" stroke-width="2" stroke-dasharray="4 5"/><text x="220" y="258" text-anchor="middle" font-size="14" fill="#607077">向下舍入</text><text x="620" y="258" text-anchor="middle" font-size="14" fill="#607077">向上舍入</text><text x="450" y="284" text-anchor="middle" font-size="14" fill="#607077">每次运算后的舍入误差会进入下一步计算。</text></svg>